name: Publicar

# Al crear una etiqueta v* (por ejemplo `git tag v0.1.0 && git push --tags`) construye el instalador y lo adjunta a una Release con su hash SHA-256.
# SIN PROBAR en GitHub todavía: se ha probado el mismo proceso en local (npm run instalador). El instalador no está firmado (ver README, SmartScreen).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  instalador:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compilar la app
        working-directory: frontend
        run: |
          npm ci
          # `tauri build` compila la app en release (y su beforeBuildCommand baja Pyodide) y de paso descarga NSIS, que usa installer/construir.mjs
          npx tauri build --bundles nsis

      - name: Construir el instalador propio
        working-directory: frontend
        run: node installer/construir.mjs

      - name: Calcular el hash SHA-256
        shell: pwsh
        working-directory: frontend/src-tauri/target/release/bundle
        run: |
          $hash = (Get-FileHash Proyecto-Alejandria-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Proyecto-Alejandria-Setup.exe" | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      # Actualizador de la app: el instalador se firma con la clave privada del proyecto (secretos de este repositorio) y se publica latest.json, que la app
      # consulta al abrir (tauri.conf.json → plugins.updater). La app solo instala lo que esté firmado con la clave pública que lleva dentro.
      - name: Firmar el instalador y preparar latest.json
        shell: pwsh
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = 'src-tauri/target/release/bundle'
          npx tauri signer sign "$dir/Proyecto-Alejandria-Setup.exe"
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo firmar el instalador' }
          $firma = (Get-Content "$dir/Proyecto-Alejandria-Setup.exe.sig" -Raw).Trim()
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $notas = (@(gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" --jq '.body // ""') -join "`n")    # con los saltos de línea (un [string] directo los vuelve espacios)
          $m = [regex]::Match($notas, '(?s)## Qué cambia\s*(.*?)\s*(?:\n## |$)')   # a la app solo le interesa «Qué cambia»: hasta el siguiente apartado, sea cual sea
          if ($m.Success) { $notas = $m.Groups[1].Value }
          $notas = $notas.Replace('**', '').Trim()
          $url = 'https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Proyecto-Alejandria-Setup.exe'
          [ordered]@{
            version = $version
            notes = $notas
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{ 'windows-x86_64' = [ordered]@{ signature = $firma; url = $url } }
          } | ConvertTo-Json -Depth 5 | Out-File -Encoding utf8 "$dir/latest.json"
          Get-Content "$dir/latest.json"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            frontend/src-tauri/target/release/bundle/Proyecto-Alejandria-Setup.exe
            frontend/src-tauri/target/release/bundle/Proyecto-Alejandria-Setup.exe.sig
            frontend/src-tauri/target/release/bundle/latest.json
            frontend/src-tauri/target/release/bundle/SHA256SUMS.txt
